name: tasrif

x-db-image: &db-image
  build:
    context: .
    dockerfile: db.Dockerfile
  image: tasrif-db

x-db-client-environment: &db-client-environment
  PGHOST: db
  PGUSER: ${PGUSER:?PGUSER must be set in .env}
  PGPASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
  PGDATABASE: ${PGDATABASE:?PGDATABASE must be set in .env}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/tautastic/tasrif-web:latest}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-client-environment
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD must be set in .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
    networks:
      - frontend
      - backend
    logging: *logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d/99-reload-loop.sh:/docker-entrypoint.d/99-reload-loop.sh:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    networks:
      - frontend
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"]
    networks:
      - frontend
    logging: *logging

  fail2ban:
    image: crazymax/fail2ban:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - nginx
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 30d
    volumes:
      - fail2ban-data:/data
      - nginx-logs:/var/log/nginx:ro
      - ./fail2ban/jail.d:/data/jail.d:ro
      - ./fail2ban/filter.d:/data/filter.d:ro
    logging: *logging

  db:
    <<: *db-image
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      APP_DB_USER: ${PGUSER:?PGUSER must be set in .env}
      APP_DB_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
      APP_DB_NAME: ${PGDATABASE:?PGDATABASE must be set in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "db-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 2s
    stop_grace_period: 1m
    networks:
      - backend
    logging: *logging

  backup:
    <<: *db-image
    entrypoint: ["db-backup", "schedule"]
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-client-environment
      BACKUP_KEEP: "7"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - backend
    logging: *logging

volumes:
  db-data:
    name: tasrif-db-data
    external: true
  certbot-etc:
  certbot-var:
  certbot-www:
  nginx-logs:
  fail2ban-data:

networks:
  frontend: {}
  backend:
    internal: true