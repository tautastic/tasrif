name: Database function tests

on:
  push:
    branches:
      - main
    paths:
      - db/**
      - tests/**
      - src/server/db/**
      - src/lib/validation/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - .github/workflows/db-tests.yml
  pull_request:
    paths:
      - db/**
      - tests/**
      - src/server/db/**
      - src/lib/validation/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - .github/workflows/db-tests.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm check

      - name: Run database function tests
        run: pnpm test
